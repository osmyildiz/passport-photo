<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Photograph a document, straighten it and save it as a PDF under the upload size limit. Runs in your browser; nothing is uploaded.">

<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e3e7ee;
    --brand: #0b3d91; --brand-ink: #ffffff; --ok: #1f8a4c; --ok-bg: #e7f5ed; --warn: #a86500; --warn-bg: #fdf3e2;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131a; --card: #171c25; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a313d;
      --brand: #4d7fd6; --brand-ink: #0b1220; --ok: #4cc283; --ok-bg: #15281e; --warn: #e3a84a; --warn-bg: #2b2213;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  a { color: var(--brand); }

  header.top { background: var(--brand); color: var(--brand-ink); }
  header.top .in { max-width: 1040px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header.top .mark { width: 34px; height: 34px; flex: none; }
  header.top .name { font-weight: 700; font-size: 1.05rem; flex: 1; letter-spacing: .01em; }
  .lang { display: inline-flex; border: 1px solid currentColor; border-radius: 999px; overflow: hidden; }
  .lang button { all: unset; cursor: pointer; padding: 4px 12px; font-size: .85rem; font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--brand-ink); color: var(--brand); }
  nav.tabs { max-width: 1040px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
  nav.tabs a { padding: 8px 14px 10px; color: var(--brand-ink); opacity: .75; text-decoration: none; font-weight: 600; font-size: .92rem; border-bottom: 3px solid transparent; }
  nav.tabs a[aria-current="page"] { opacity: 1; border-color: var(--brand-ink); }

  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .card + .card { margin-top: 16px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 16px; max-width: 720px; }
  .privacy { display: flex; align-items: flex-start; gap: 12px; margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); max-width: 720px; }
  .privacy svg { width: 26px; height: 26px; flex: none; color: var(--ok); margin-top: 1px; }
  .privacy b { display: block; color: var(--ok); font-size: 1rem; }
  .privacy span { display: block; color: var(--ink); font-size: .88rem; margin-top: 2px; }

  .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; }
  @media (max-width: 420px) { .pickers { grid-template-columns: 1fr; } }
  .pick, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 12px; cursor: pointer; font-weight: 650; font-size: 1rem; background: var(--brand); color: var(--brand-ink); border: 0; text-decoration: none; font-family: inherit; }
  .pick.alt, .btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .pick svg, .btn svg { width: 20px; height: 20px; flex: none; }
  .pick input { display: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }

  #editor { touch-action: none; }
  .stage { position: relative; max-width: 560px; margin: 0 auto; }
  .stage canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .row > * { flex: 1 1 160px; }

  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .opts label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
  select { font: inherit; font-weight: 500; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }

  .pages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .pages li { background: var(--bg); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .pages canvas { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .pages .bar { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: .82rem; color: var(--muted); white-space: nowrap; }
  .pages .bar > span:last-child { display: flex; }
  .pages .bar button { all: unset; cursor: pointer; padding: 4px; border-radius: 6px; color: var(--ink); }
  .pages .bar button:hover { background: var(--line); }
  .pages .bar svg { width: 18px; height: 18px; display: block; }
  .size { margin-top: 14px; font-weight: 600; }
  .size.over { color: var(--warn); }
  .local { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--ok); font-size: .88rem; font-weight: 600; }
  .local svg { width: 16px; height: 16px; flex: none; }
  .tips { margin: 0; padding-left: 20px; color: var(--muted); font-size: .92rem; }
  .tips li + li { margin-top: 4px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 28px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="31" height="31" rx="7" stroke="currentColor" stroke-width="2"/>
      <path d="M11 8h9l5 5v13H11z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>

<main>
  <section class="card">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="privacy">

  <section class="card hidden" id="editor">

    <div class="opts">
      <label><span data-i18n="modeL"></span>
        <select id="mode"><option value="clean" data-i18n="modeClean"></option><option value="bw" data-i18n="modeBw"></option><option value="photo" data-i18n="modePhoto"></option></select></label>
      <label><span data-i18n="paperL"></span>
        <select id="paper"><option value="letter" data-i18n="paperLetter"></option><option value="a4" data-i18n="paperA4"></option></select></label>
      <label><span data-i18n="limitL"></span>
        <select id="limit"><option value="1">1 MB</option><option value="2" selected>2 MB</option><option value="4">4 MB</option><option value="10">10 MB</option></select></label>
    </div>
    <ul class="pages" id="pages"></ul>
    <p class="size" id="size"></p>
    <div class="row">
      <a class="btn" id="dlPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span data-i18n="dlPdf"></span></a>
      <label class="pick alt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addPage"></span><input id="more" type="file" accept="image/*" multiple></label>
    </div>
    <p class="local"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="localNote"></span></p>
  </section>

  <section class="card">
    <h2 data-i18n="tipsH"></h2>
    <ul class="tips" id="tips"></ul>
  </section>

  <footer data-i18n="footer"></footer>
</main>

<script>
const I18N = {
  tr: {
    brand: "Belge Tarayıcı", tabPhoto: "Vesikalık fotoğraf", tabDoc: "Belge tarayıcı",
    title: "Belgeyi telefonla tarayın, PDF olarak kaydedin",
    lead: "Belgenin fotoğrafını çekin. Kâğıdın köşeleri bulunur, eğiklik düzeltilir, kâğıt beyazlatılır ve sayfalar başvuru sitelerinin istediği boyut sınırının altında tek bir PDF'te toplanır.",
    privacyH: "Belgeleriniz bu cihazdan çıkmaz",
    privacy: "Pasaport, kimlik, banka ya da göçmenlik evrakı gibi belgeler hiçbir sunucuya yüklenmez; bütün işlem telefonunuzda ya da bilgisayarınızda yapılır.",
    cam: "Kamerayla çek", file: "Dosyadan seç",
    cornersH: "Köşeleri kontrol edin",
    cornersNote: "Mavi çerçeve kâğıdın kenarlarına oturmalı. Oturmadıysa köşeleri parmağınızla sürükleyin.",
    accept: "Sayfayı ekle", fullImg: "Tüm fotoğrafı kullan", cancel: "Vazgeç",
    pagesH: "Sayfalar",
    modeL: "Görünüm", modeClean: "Tarama (kâğıt beyaz, renkler kalır)", modeBw: "Siyah-beyaz (metin belgeleri)", modePhoto: "Orijinal renkler",
    paperL: "Kâğıt", paperLetter: "Letter (ABD, 8,5×11 inç)", paperA4: "A4 (Türkiye ve Avrupa)",
    limitL: "Dosya boyutu sınırı",
    dlPdf: "PDF indir", addPage: "Sayfa ekle",
    localNote: "PDF bu cihazda oluşturuldu; hiçbir yere gönderilmedi.",
    size: (n, kb, lim) => `${n} sayfa · ${kb} · sınır ${lim} MB`,
    over: lim => ` — sınırın altına inemedi; sayfa sayısını azaltın ya da daha büyük sınır seçin.`,
    page: n => `Sayfa ${n}`, rot: "Döndür", del: "Sil", up: "Öne al",
    detecting: "Köşeler aranıyor…", notFound: "Kâğıdın kenarları bulunamadı; köşeleri elle yerleştirin.",
    making: "PDF hazırlanıyor…",
    tipsH: "İyi bir tarama için",
    tips: ["Belgeyi koyu renkli, düz bir zeminin üstüne koyun; kâğıt ile zemin ayrışsın.", "Telefonu belgenin tam üstünde, kâğıda paralel tutun.", "Gün ışığında çekin; telefonun gölgesi kâğıda düşmesin.", "Kimlik ve pasaport gibi küçük belgelerde önce yakından çekin, sonra köşeleri kontrol edin."],
    footer: "Resmî bir hizmet değildir. Belgenin kabulü başvurduğunuz kuruma aittir.",
    file_: "belge.pdf"
  },
  en: {
    brand: "Document Scanner", tabPhoto: "ID photo", tabDoc: "Document scanner",
    title: "Scan a document with your phone, save it as a PDF",
    lead: "Take a photo of the document. The paper corners are found, the tilt is corrected, the paper is whitened, and the pages are combined into one PDF under the size limit that upload sites ask for.",
    privacyH: "Your documents never leave this device",
    privacy: "Passports, IDs, bank or immigration papers are never uploaded to a server; everything runs on your phone or computer.",
    cam: "Take a photo", file: "Choose a file",
    cornersH: "Check the corners",
    cornersNote: "The blue frame should sit on the paper edges. If it doesn't, drag the corners with your finger.",
    accept: "Add page", fullImg: "Use the whole photo", cancel: "Cancel",
    pagesH: "Pages",
    modeL: "Look", modeClean: "Scan (white paper, colors kept)", modeBw: "Black & white (text documents)", modePhoto: "Original colors",
    paperL: "Paper", paperLetter: "Letter (US, 8.5×11 in)", paperA4: "A4 (Europe, Turkey)",
    limitL: "File size limit",
    dlPdf: "Download PDF", addPage: "Add page",
    localNote: "The PDF was made on this device and was not sent anywhere.",
    size: (n, kb, lim) => `${n} page${n > 1 ? "s" : ""} · ${kb} · limit ${lim} MB`,
    over: lim => ` — could not get under the limit; remove pages or choose a larger limit.`,
    page: n => `Page ${n}`, rot: "Rotate", del: "Delete", up: "Move up",
    detecting: "Finding the corners…", notFound: "The paper edges were not found; place the corners by hand.",
    making: "Making the PDF…",
    tipsH: "For a good scan",
    tips: ["Put the document on a dark, plain surface so the paper stands out.", "Hold the phone straight above the document, parallel to the paper.", "Use daylight and keep the phone's shadow off the paper.", "For small documents such as IDs and passports, shoot close, then check the corners."],
    footer: "Not an official service. Acceptance is decided by the office you apply to.",
    file_: "document.pdf"
  }
};
let lang = (() => {
  try { const s = localStorage.getItem("lang"); if (s === "tr" || s === "en") return s; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
})();
const L = () => I18N[lang];
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L()[el.dataset.i18n]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("tips").innerHTML = L().tips.map(t => `<li>${t}</li>`).join("");
  $("dlPdf").download = L().file_;
  renderPages();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
}));

// ---------- image loading (EXIF orientation is applied by createImageBitmap / <img>)
const MAX_SRC = 3000;     // long side kept for the flattening step
async function loadImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const w = bmp.width, h = bmp.height, k = Math.min(1, MAX_SRC / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}

// ---------- paper detection: the largest bright, low-saturation region; corners from its extreme points
function detectCorners(src) {
  const D = 320, k = D / Math.max(src.width, src.height);
  const w = Math.round(src.width * k), h = Math.round(src.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.drawImage(src, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  // "paper-ness": bright and grey-ish
  const v = new Float32Array(w * h), hist = new Uint32Array(256);
  for (let i = 0; i < w * h; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const p = clamp(mx - 0.7 * (mx - mn), 0, 255);
    v[i] = p; hist[p | 0]++;
  }
  // Otsu threshold
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = w * h - wB; if (!wF) break;
    sB += t * hist[t];
    const between = wB * wF * (sB / wB - (sum - sB) / wF) ** 2;
    if (between > best) { best = between; thr = t; }
  }
  const on = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) on[i] = v[i] > thr ? 1 : 0;
  // largest 4-connected bright component
  const lab = new Int32Array(w * h), stack = [];
  let bestLab = 0, bestN = 0, n = 0;
  for (let s = 0; s < w * h; s++) {
    if (!on[s] || lab[s]) continue;
    n++; let cnt = 0; stack.push(s); lab[s] = n;
    while (stack.length) {
      const q = stack.pop(); cnt++;
      const x = q % w, y = (q / w) | 0;
      if (x > 0 && on[q - 1] && !lab[q - 1]) { lab[q - 1] = n; stack.push(q - 1); }
      if (x < w - 1 && on[q + 1] && !lab[q + 1]) { lab[q + 1] = n; stack.push(q + 1); }
      if (y > 0 && on[q - w] && !lab[q - w]) { lab[q - w] = n; stack.push(q - w); }
      if (y < h - 1 && on[q + w] && !lab[q + w]) { lab[q + w] = n; stack.push(q + w); }
    }
    if (cnt > bestN) { bestN = cnt; bestLab = n; }
  }
  const frac = bestN / (w * h);
  // the region's leftmost and rightmost pixel in every row are enough for its convex hull
  const rows = [];
  let edge = 0;
  for (let y = 0; y < h; y++) {
    let a = -1, b = -1;
    for (let x = 0; x < w; x++) if (lab[y * w + x] === bestLab) { if (a < 0) a = x; b = x; }
    if (a < 0) continue;
    rows.push({ x: a, y }, { x: b + 1, y }, { x: a, y: y + 1 }, { x: b + 1, y: y + 1 });
    if (y === 0 || y === h - 1) edge += b - a + 1; else edge += (a === 0) + (b === w - 1);
  }
  const hull = convexHull(rows);
  if (hull.length < 4) return null;
  // pulled 1% toward the centre so a few pixels of corner error don't leave a dark strip of table on the page
  const Q = maxQuad(hull), mx = Q.reduce((s, p) => s + p.x, 0) / 4, my = Q.reduce((s, p) => s + p.y, 0) / 4;
  const quad = Q.map(p => ({ x: (mx + (p.x - mx) * 0.99) / k, y: (my + (p.y - my) * 0.99) / k }));
  // the paper should be a sizeable region that is mostly inside the frame, and the quad should be convex and big
  const area = polyArea(quad) / (src.width * src.height);
  const ok = frac > 0.04 && frac < 0.97 && area > 0.04 && edge < 2 * (w + h) * 0.5 && convex(quad);
  return ok ? quad : null;
}
function convexHull(pts) {     // Andrew's monotone chain
  pts = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
// the four hull points spanning the largest area, returned as top-left, top-right, bottom-right, bottom-left
function maxQuad(H) {
  const n = H.length, tri = (a, b, c) => Math.abs((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
  let best = -1, Q = null;

// ---------- corner editor
let edit = null;          // { src, quad, view }
let queue = [];           // files waiting for corner checks

  const ctx = stage.getContext("2d");
  ctx.drawImage(src, 0, 0, stage.width, stage.height);

async function nextInQueue() {
  if (!queue.length) { $("editor").classList.add("hidden"); edit = null; return; }
  const file = queue.shift();
  $("status").textContent = L().detecting;
  const src = await loadImage(file);
  const found = detectCorners(src);
  edit = { src, quad: found || insetQuad(src.width, src.height) };
  $("status").textContent = found ? "" : L().notFound;
  $("editor").classList.remove("hidden");

// ---------- pages and PDF
const pages = [];
const ICONS = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6l6-6 6 6"/></svg>',
  rot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>'

    pg.view = pageCanvas(pg);
    const li = document.createElement("li");
    const th = document.createElement("canvas"), k = 300 / Math.max(pg.view.width, pg.view.height);
    th.width = Math.round(pg.view.width * k); th.height = Math.round(pg.view.height * k);

    bar.innerHTML = `<span>${L().page(i + 1)}</span><span>${i ? `<button data-a="up" title="${L().up}" aria-label="${L().up}">${ICONS.up}</button>` : ""}<button data-a="rot" title="${L().rot}" aria-label="${L().rot}">${ICONS.rot}</button><button data-a="del" title="${L().del}" aria-label="${L().del}">${ICONS.del}</button></span>`;

const toBlob = (cv, q) => new Promise(res => cv.toBlob(res, "image/jpeg", q));

async function buildPdf() {
  const job = ++pdfJob;
  $("size").textContent = L().making; $("size").classList.remove("over");
  $("dlPdf").removeAttribute("href");
  const limit = +$("limit").value * 1024 * 1024;
  // shrink quality first, then resolution, until the whole file fits
  let pdf, scale = 1, q = 0.85;
  for (let step = 0; step < 12; step++) {
    const imgs = [];
    for (const pg of pages) {
      const v = pg.view, k = Math.min(1, scale * OUT_MAX / Math.max(v.width, v.height));
      const c = document.createElement("canvas"); c.width = Math.round(v.width * k); c.height = Math.round(v.height * k);

  $("size").textContent = L().size(pages.length, kb, $("limit").value) + (over ? L().over() : "");

// Minimal PDF: one page per image, each image (JPEG) fitted to the paper with a small margin.

const onPick = e => {
  queue.push(...e.target.files); e.target.value = "";
  if (!edit) nextInQueue().catch(err => { $("status").textContent = err.message; });
};
$("cam").addEventListener("change", onPick);
$("file").addEventListener("change", onPick);

for (const id of ["mode"]) $(id).addEventListener("change", renderPages);
for (const id of ["paper", "limit"]) $(id).addEventListener("change", buildPdf);
