<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3d91">
<title>Pasaport Fotoğrafı</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e3e7ee;
    --brand: #0b3d91; --brand-ink: #ffffff; --accent: #b31942;
    --ok: #1f8a4c; --ok-bg: #e7f5ed; --warn: #a86500; --warn-bg: #fdf3e2;
    --fail: #c53030; --fail-bg: #fdecec; --fix: #2459b3; --fix-bg: #e8effb;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131a; --card: #171c25; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a313d;
      --brand: #4d7fd6; --brand-ink: #0b1220; --accent: #e0577a;
      --ok: #4cc283; --ok-bg: #15281e; --warn: #e3a84a; --warn-bg: #2b2213;
      --fail: #f07171; --fail-bg: #2e1717; --fix: #78a6f0; --fix-bg: #172238;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  a { color: var(--brand); }

  header.top { background: var(--brand); color: var(--brand-ink); }
  header.top .in { max-width: 1040px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header.top .mark { width: 34px; height: 34px; flex: none; }
  header.top .name { font-weight: 700; font-size: 1.05rem; flex: 1; letter-spacing: .01em; }
  .lang { display: inline-flex; border: 1px solid currentColor; border-radius: 999px; overflow: hidden; }
  .lang button { all: unset; cursor: pointer; padding: 4px 12px; font-size: .85rem; font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--brand-ink); color: var(--brand); }

  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .card + .card, .grid + .card, .card + .grid { margin-top: 16px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 16px; max-width: 720px; }

  .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; }
  @media (max-width: 420px) { .pickers { grid-template-columns: 1fr; } }
  .pick { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 12px; cursor: pointer; font-weight: 650; font-size: 1rem; background: var(--brand); color: var(--brand-ink); }
  .pick.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .pick svg { width: 20px; height: 20px; }
  .pick input { display: none; }
  .privacy { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: .9rem; }
  .privacy svg { width: 16px; height: 16px; flex: none; color: var(--ok); }

  .steps { display: flex; gap: 6px; margin: 18px 0 0; padding: 0; list-style: none; counter-reset: s; flex-wrap: wrap; }
  .steps li { counter-increment: s; display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--bg); }
  .steps li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--muted); font-weight: 700; font-size: .78rem; }
  .steps li.on { color: var(--ink); font-weight: 600; }
  .steps li.on::before { background: var(--brand); color: var(--brand-ink); }
  .steps li.done::before { background: var(--ok); color: #fff; content: "✓"; }

  #status { margin-top: 12px; color: var(--muted); font-size: .9rem; min-height: 1.4em; display: flex; align-items: center; gap: 8px; }
  #status.busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid { display: grid; grid-template-columns: 5fr 6fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  canvas.preview { width: 100%; height: auto; display: block; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }

  .verdict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-weight: 600; margin-bottom: 8px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.fail { background: var(--fail-bg); color: var(--fail); }
  ul.checks { list-style: none; padding: 0; margin: 0; }
  ul.checks li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  ul.checks li:last-child { border-bottom: 0; }
  .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
  .ok .ic { background: var(--ok-bg); color: var(--ok); }
  .warn .ic { background: var(--warn-bg); color: var(--warn); }
  .fail .ic { background: var(--fail-bg); color: var(--fail); }
  .fix .ic { background: var(--fix-bg); color: var(--fix); }
  .t { font-weight: 600; }
  .d { color: var(--muted); font-size: .9rem; margin-top: 1px; }

  .opt { margin: 0 0 18px; padding: 14px 16px; background: var(--fix-bg); border: 2px solid var(--brand); border-radius: 14px; }
  .opt.rec { animation: pulse 1.6s ease-out 3; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  .opt-row { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .opt-ic { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); }
  .opt-ic svg { width: 22px; height: 22px; }
  .opt-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
  .opt-text b { font-size: 1.02rem; }
  .opt-text small { color: var(--muted); font-size: .86rem; margin-top: 2px; }
  .badge { align-self: flex-start; margin-bottom: 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .opt input:checked + .sw { background: var(--ok); }
  .opt input:checked + .sw::after { transform: translateX(20px); }
  .opt input:focus-visible + .sw { outline: 2px solid var(--brand); outline-offset: 2px; }
  .why { margin: 10px 0 0 52px; font-size: .88rem; }
  .why summary { color: var(--brand); font-weight: 600; }
  .why p { margin: 6px 0 0; color: var(--muted); }
  @media (max-width: 420px) { .why { margin-left: 0; } }

  .outputs { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .outputs { grid-template-columns: 1fr; } .outputs > div:first-child { max-width: 300px; } }
  .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 11px 16px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); text-decoration: none; font-weight: 650; }
  .btn svg { width: 18px; height: 18px; }
  .note { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }

  .tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
  .tips li { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: .92rem; }
  .tips li b { color: var(--brand); font-size: 1.05rem; line-height: 1.3; }
  details summary { cursor: pointer; font-weight: 600; }
  details p { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 28px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="31" height="31" rx="7" stroke="currentColor" stroke-width="2"/>
      <circle cx="17" cy="14" r="5.5" fill="currentColor"/>
      <path d="M7.5 29c1.5-5.2 5.2-8 9.5-8s8 2.8 9.5 8" fill="currentColor"/>
    </svg>
    <div class="name" data-i18n="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="pickers">
      <label class="pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span data-i18n="cam"></span><input id="cam" type="file" accept="image/*" capture="user">
      </label>
      <label class="pick alt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
        <span data-i18n="file"></span><input id="file" type="file" accept="image/*">
      </label>
    </div>
    <div class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="privacy"></span>
    </div>
    <ol class="steps" id="steps">
      <li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li>
    </ol>
    <div id="status" class="busy"></div>
  </section>

  <section id="result" class="hidden">
    <div class="grid" style="margin-top:16px">
      <div class="card">
        <h2 data-i18n="uploaded"></h2>
        <canvas id="srcView" class="preview"></canvas>
        <div class="legend">
          <span style="--c:#2b6cb0" data-i18n="legendCrop"></span>
          <span style="--c:#1f8a4c" data-i18n="legendLines"></span>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="checksH"></h2>
        <div id="verdict" class="verdict"></div>
        <ul id="checks" class="checks"></ul>
      </div>
    </div>

    <section id="out" class="card hidden">
      <h2 data-i18n="outputsH"></h2>
      <div id="bgOpt" class="opt">
        <label class="opt-row">
          <span class="opt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l10-10m2-6v3m0 6v3m-5-6h3m6 0h3m-9.5-4.5l2 2m4 4l2 2m0-8l-2 2"/></svg></span>
          <span class="opt-text"><span id="bgRec" class="badge hidden" data-i18n="recommended"></span><b data-i18n="whiten"></b><small data-i18n="whitenShort"></small></span>
          <input type="checkbox" id="whiten" role="switch"><span class="sw" aria-hidden="true"></span>
        </label>
        <details class="why"><summary data-i18n="whyH"></summary><p data-i18n="whitenNote"></p></details>
      </div>
      <div class="outputs">
        <div>
          <canvas id="digital" class="preview"></canvas>
          <a id="dlDigital" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span data-i18n="dlDigital"></span></a>
          <p class="note" data-i18n="digitalNote"></p>
        </div>
        <div>
          <canvas id="sheet" class="preview"></canvas>
          <a id="dlSheet" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span data-i18n="dlSheet"></span></a>
          <p class="note" data-i18n-html="printNote"></p>
        </div>
      </div>
    </section>
  </section>

  <section class="card">
    <h2 data-i18n="tipsH"></h2>
    <ul class="tips" id="tips"></ul>
  </section>

  <section class="card">
    <details>
      <summary data-i18n="aboutH"></summary>
      <p data-i18n-html="aboutBody"></p>
    </details>
  </section>

  <footer data-i18n="footer"></footer>
</main>

let lang = (() => {
  try { const s = localStorage.getItem("lang"); if (s === "tr" || s === "en") return s; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
})();
const L = () => I18N[lang];
const num = (v, d = 0) => v.toLocaleString(lang === "tr" ? "tr-TR" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const checkText = c => {
  const e = L().c[c.key];
  if (typeof e !== "function") return e;
  const p = { ...c.p };
  if (p.why) p.why = p.why.map(k => L().bg[k]).join(", ");
  for (const k of ["a", "h", "e"]) if (typeof p[k] === "number") p[k] = num(p[k], k === "a" ? (p.d ?? 0) : 2);
  for (const k of ["p", "px"]) if (typeof p[k] === "number") p[k] = num(p[k]);
  return e(p);
};

const $ = id => document.getElementById(id);
let statusKey = "loading", statusExtra = "";
const status = (key, extra = "") => {
  statusKey = key; statusExtra = extra;
  $("status").textContent = (L().ui[key] || "") + extra;
  $("status").classList.toggle("busy", key === "loading" || key === "processing");
};
let step = 1;
const setStep = n => {
  step = n;
  [...$("steps").children].forEach((li, i) => { li.className = i + 1 < n ? "done" : i + 1 === n ? "on" : ""; });
};

function applyLang() {
  document.documentElement.lang = lang;
  document.title = L().ui.brand;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L().ui[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = L().ui[el.dataset.i18nHtml]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("tips").innerHTML = L().ui.tips.map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join("");
  $("dlDigital").download = L().ui.fileDigital;
  $("dlSheet").download = L().ui.fileSheet;
  status(statusKey, statusExtra);
  if (current) renderChecks(current.res);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
}));

// ---------------------------------------------------------------- models

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const deg = r => r * 180 / Math.PI;
const lum = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;

let faceModel, segModel;
const ready = (async () => {
  const fs = await FilesetResolver.forVisionTasks(WASM);
  faceModel = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: FACE_MODEL, delegate: "CPU" },
    runningMode: "IMAGE", numFaces: 2,
    outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true,
  });
  segModel = await ImageSegmenter.createFromOptions(fs, {
    baseOptions: { modelAssetPath: SEG_MODEL, delegate: "CPU" },
    runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: true,
  });
  status("ready");
})().catch(e => { status("loadFail", e.message); throw e; });

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("image"));
    img.src = URL.createObjectURL(file);
  });
}

// ---------------------------------------------------------------- analysis

function analyze(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const k = Math.min(1, 1280 / Math.max(W, H));
  const work = document.createElement("canvas");
  work.width = Math.round(W * k); work.height = Math.round(H * k);
  const wctx = work.getContext("2d", { willReadFrequently: true });
  wctx.drawImage(img, 0, 0, work.width, work.height);
  const ww = work.width, wh = work.height;

  const checks = [];
  const add = (status, key, p = {}) => checks.push({ status, key, p });

  const fr = faceModel.detect(work);
  const nFaces = fr.faceLandmarks.length;
  if (nFaces !== 1) {
    add("fail", nFaces === 0 ? "noFace" : "manyFaces");
    return { checks, work };
  }
  add("ok", "oneFace");

  let mw, mh, cat, bgConf;
  segModel.segment(work, r => {
    mw = r.categoryMask.width; mh = r.categoryMask.height;
    cat = r.categoryMask.getAsUint8Array().slice();
    bgConf = r.confidenceMasks[CLS.BG].getAsFloat32Array().slice();
  });
  const clsAt = (nx, ny) => cat[clamp(Math.floor(ny * mh), 0, mh - 1) * mw + clamp(Math.floor(nx * mw), 0, mw - 1)];

  const lm = fr.faceLandmarks[0];
  const bs = Object.fromEntries(fr.faceBlendshapes[0].categories.map(c => [c.categoryName, c.score]));
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });      // original pixels

  // --- pose: yaw and pitch from the 3D head transform, roll from the eye line
  const m = fr.facialTransformationMatrixes[0].data;      // column-major 4x4
  const r = (row, col) => m[col * 4 + row];
  const pitch = deg(Math.atan2(r(2, 1), r(2, 2)));
  const yaw = deg(Math.asin(clamp(-r(2, 0), -1, 1)));
  const eyeL = mid(P(33), P(133)), eyeR = mid(P(362), P(263));
  const E = mid(eyeL, eyeR);
  const roll = Math.atan2(eyeR.y - eyeL.y, eyeR.x - eyeL.x);

  const ay = Math.abs(yaw), ap = Math.abs(pitch);
  add(ay > 10 ? "fail" : ay > 6 ? "warn" : "ok", ay > 10 ? "yawFail" : ay > 6 ? "yawWarn" : "yawOk", { a: ay });
  add(ap > 15 ? "fail" : ap > 9 ? "warn" : "ok", ap > 15 ? "pitchFail" : ap > 9 ? "pitchWarn" : "pitchOk", { a: ap });
  const ar = Math.abs(deg(roll));
  if (ar > 10) add("fail", "rollFail", { a: ar });
  else if (ar > 2) add("fix", "rollFix", { a: ar, d: 1 });
  else add("ok", "rollOk", { a: ar, d: 1 });

  // --- eyes, gaze, mouth
  const blink = Math.max(bs.eyeBlinkLeft, bs.eyeBlinkRight);
  if (blink > 0.5) add("fail", "eyesClosed");
  else if (blink > 0.35) add("warn", "eyesSquint");
  else add("ok", "eyesOk");
  const gaze = Math.max(...["Left", "Right"].flatMap(s => ["In", "Out", "Up", "Down"].map(d => bs[`eyeLook${d}${s}`])));
  if (gaze > 0.55) add("warn", "gaze");
  if (bs.jawOpen > 0.35) add("fail", "mouthOpen");
  else if (bs.jawOpen > 0.2) add("warn", "mouthAjar");
  const smile = Math.max(bs.mouthSmileLeft, bs.mouthSmileRight);
  if (smile > 0.7) add("warn", "bigSmile");
  if (bs.jawOpen <= 0.2 && smile <= 0.7) add("ok", "exprOk");

  // --- top of head from the hair/face mask, chin from landmarks
  const chin = P(152), forehead = P(10);
  const cheekL = P(234), cheekR = P(454);
  const faceW = Math.abs(cheekR.x - cheekL.x);
  const fcX = (cheekL.x + cheekR.x) / 2;
  const tops = [];
  for (let x = fcX - 0.25 * faceW; x <= fcX + 0.25 * faceW; x += Math.max(1, faceW / 60)) {
    for (let my = 0; my < mh; my++) {
      const c = clsAt(x / W, my / mh);
      if (c === CLS.HAIR || c === CLS.FACE) { tops.push(my / mh * H); break; }
    }
  }
  tops.sort((a, b) => a - b);
  let top, topMeasured = true;
  const tTop = tops.length ? tops[Math.floor(tops.length * 0.1)] : Infinity;
  if (tTop < forehead.y) top = { x: fcX, y: tTop };
  else { top = { x: fcX, y: forehead.y - 0.25 * (chin.y - forehead.y) }; topMeasured = false; }
  if (top.y <= H * 0.005) add("fail", "topCut");
  if (!topMeasured) add("warn", "topEst");

  // --- geometry in a frame rotated so the eyes are level, origin at the eye midpoint
  const c = Math.cos(-roll), s = Math.sin(-roll);
  const rot = p => ({ x: (p.x - E.x) * c - (p.y - E.y) * s, y: (p.x - E.x) * s + (p.y - E.y) * c });
  const chinR = rot(chin), topR = rot(top), fcR = rot({ x: fcX, y: E.y });
  const headH = chinR.y - topR.y;

  // output -> source mapping for a given scale and offset
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const backFor = (sc, T) => (u, v) => {
    const qx = (u - T.x) / sc, qy = (v - T.y) / sc;
    return { x: E.x + qx * cr - qy * sr, y: E.y + qx * sr + qy * cr };
  };
  const overflow = back => {
    let outside = 0, n = 0;
    for (let v = 0; v <= S; v += S / 40) for (let u = 0; u <= S; u += S / 40) {
      const p = back(u, v); n++;
      if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) outside++;
    }
    return outside / n;
  };

  // Search the allowed head-size and eye-height ranges; prefer no overflow, then closeness to the target.
  let geo = null;
  for (let ratio = HEAD_MIN + 0.02; ratio <= HEAD_MAX - 0.04 + 1e-9; ratio += 0.01) {
    const sc = ratio * S / headH;
    const lo = Math.max(S * (1 - EYE_MAX), S * 0.03 - sc * topR.y);
    const hi = Math.min(S * (1 - EYE_MIN), S * 0.97 - sc * chinR.y);
    for (let eyeOut = lo; eyeOut <= hi; eyeOut += 3) {
      const T = { x: S / 2 - sc * fcR.x, y: eyeOut };
      const of = overflow(backFor(sc, T));
      const score = of * 100 + Math.abs(ratio - HEAD_TARGET) * 10 + Math.abs(eyeOut / S - EYE_TARGET_FROM_TOP) * 5;
      if (!geo || score < geo.score) geo = { ratio, sc, eyeOut, T, of, score };
    }
  }
  if (!geo) {
    add("fail", "geoFail");
    return { checks, work };
  }
  Object.assign(geo, { E, roll, W, H, mw, mh, bgConf, chin, top });
  geo.back = backFor(geo.sc, geo.T);   // also used for the preview square
  const outFrac = geo.of;
  if (outFrac > 0.03) add("fail", "frameTight", { p: outFrac * 100 });
  else if (outFrac > 0) add("warn", "frameEdge");

  if (headH < 240) add("fail", "resLow", { px: headH });
  else if (headH < geo.ratio * S) add("warn", "resEdge", { px: headH });
  else add("ok", "resOk", { px: headH });

  add("ok", "geoOk", { h: geo.ratio * 2, e: (S - geo.eyeOut) / S * 2 });

  // --- pixel statistics on the work canvas
  const data = wctx.getImageData(0, 0, ww, wh).data;
  const xL = (fcX - (S / 2) / geo.sc) * k, xR = (fcX + (S / 2) / geo.sc) * k;
  const fxMid = P(1).x * k;
  let bgN = 0, bgL = 0, bgL2 = 0, bgSat = 0, fL = [0, 0], fN = [0, 0];
  for (let y = 0; y < wh; y += 2) for (let x = 0; x < ww; x += 2) {
    const i = (y * ww + x) * 4;
    const R = data[i], G = data[i + 1], B = data[i + 2];
    const cl = clsAt(x / ww, y / wh), Lv = lum(R, G, B);
    if (cl === CLS.BG && y < chin.y * k && x >= xL && x <= xR) {
      bgN++; bgL += Lv; bgL2 += Lv * Lv; bgSat += Math.max(R, G, B) - Math.min(R, G, B);
    } else if (cl === CLS.FACE) {
      const side = x < fxMid ? 0 : 1; fL[side] += Lv; fN[side]++;
    }
  }

  // background
  geo.bgFixable = false;
  if (bgN > 50) {
    const mean = bgL / bgN, sd = Math.sqrt(Math.max(0, bgL2 / bgN - mean * mean)), sat = bgSat / bgN;
    if (mean >= 190 && sd <= 28 && sat <= 30) add("ok", "bgOk");
    else {
      geo.bgFixable = true;
      add("warn", "bgBad", { why: [mean < 190 && "dark", sd > 28 && "busy", sat > 30 && "colored"].filter(Boolean) });
    }
  }

  // face lighting: median brightness of skin patches around fixed landmarks.
  // "L"/"R" are image left/right (as the viewer sees the photo).
  // under-eye patch sits halfway between the lower lid and the upper cheek, where overhead light leaves its shadow
  const PATCH = { foreheadL: [108], foreheadR: [337], underEyeL: [145, 118], underEyeR: [374, 347], cheekL: [205], cheekR: [425], chin: [199] };
  const pr = 0.06 * faceW * k, med = {};
  for (const [name, ids] of Object.entries(PATCH)) {
    const c = { x: ids.reduce((s, i) => s + P(i).x, 0) / ids.length * k, y: ids.reduce((s, i) => s + P(i).y, 0) / ids.length * k }, v = [];
    for (let y = c.y - pr; y <= c.y + pr; y += Math.max(1, pr / 8)) for (let x = c.x - pr; x <= c.x + pr; x += Math.max(1, pr / 8)) {
      if ((x - c.x) ** 2 + (y - c.y) ** 2 > pr * pr || clsAt(x / ww, y / wh) !== CLS.FACE) continue;
      const i = (clamp(Math.round(y), 0, wh - 1) * ww + clamp(Math.round(x), 0, ww - 1)) * 4;
      v.push(lum(data[i], data[i + 1], data[i + 2]));
    }
    if (v.length >= 20) { v.sort((a, b) => a - b); med[name] = v[v.length >> 1]; }
  }
  // glare: share of skin pixels that are clipped to white
  let skinN = 0, clipN = 0;
  for (let y = 0; y < wh; y += 2) for (let x = 0; x < ww; x += 2) {
    if (clsAt(x / ww, y / wh) !== CLS.FACE) continue;
    const i = (y * ww + x) * 4; skinN++;
    if (Math.min(data[i], data[i + 1], data[i + 2]) >= 245) clipN++;
  }
  const vals = Object.values(med).sort((a, b) => b - a);
  if (fN[0] > 30 && fN[1] > 30 && vals.length >= 4) {
    const ref = vals[1];                                     // second brightest: robust to one shiny spot
    const rel = Object.fromEntries(Object.entries(med).map(([n, v]) => [n, v / ref]));
    const side = s => { const v = ["forehead", "underEye", "cheek"].map(n => med[n + s]).filter(v => v !== undefined); return v.reduce((a, b) => a + b, 0) / v.length; };
    const sl = side("L"), sr = side("R"), sideRatio = Math.min(sl, sr) / Math.max(sl, sr);
    const pair = n => { const v = [rel[n + "L"], rel[n + "R"]].filter(v => v !== undefined); return v.length ? Math.max(...v) : 1; };
    // an area is shadowed when both of its patches are dark (light from above / below), chin on its own
    const area = { forehead: pair("forehead"), underEye: pair("underEye"), chin: rel.chin ?? 1 };
    const [worst, worstV] = Object.entries(area).sort((a, b) => a[1] - b[1])[0];
    geo.light = { med, rel, sideRatio, area, glare: clipN / Math.max(1, skinN) };
    const mean = (fL[0] + fL[1]) / (fN[0] + fN[1]);
    let lit = true;
    if (sideRatio < SHADOW.sideFail || sideRatio < SHADOW.sideWarn) {
      add(sideRatio < SHADOW.sideFail ? "fail" : "warn", "shadowSide", { s: sl < sr ? "L" : "R" }); lit = false;
    }
    if (worstV < SHADOW.area[worst]) { add("warn", "shadow_" + worst); lit = false; }
    if (geo.light.glare > SHADOW.glare) { add("warn", "glare"); lit = false; }
    if (lit) add("ok", "lightOk");
    if (mean < 60 || mean > 235) add("fail", mean < 60 ? "tooDark" : "tooBright");
    else if (mean < 85 || mean > 215) add("warn", mean < 85 ? "bitDark" : "bitBright");
  }

  // sharpness: variance of the Laplacian over the face, normalised to a fixed width
  const fx0 = cheekL.x * k, fy0 = forehead.y * k, fw = faceW * k, fh = (chin.y - forehead.y) * k;
  const tw = 192, th = Math.max(8, Math.round(tw * fh / fw));
  const tc = document.createElement("canvas"); tc.width = tw; tc.height = th;
  const tctx = tc.getContext("2d", { willReadFrequently: true });
  tctx.drawImage(work, Math.min(fx0, cheekR.x * k), fy0, fw, fh, 0, 0, tw, th);
  const td = tctx.getImageData(0, 0, tw, th).data;
  const g = (x, y) => { const i = (y * tw + x) * 4; return lum(td[i], td[i + 1], td[i + 2]); };
  let lapS = 0, lapS2 = 0, lapN = 0;
  for (let y = 1; y < th - 1; y++) for (let x = 1; x < tw - 1; x++) {
    const v = 4 * g(x, y) - g(x - 1, y) - g(x + 1, y) - g(x, y - 1) - g(x, y + 1);
    lapS += v; lapS2 += v * v; lapN++;
  }
  const sharp = lapS2 / lapN - (lapS / lapN) ** 2;
  if (sharp < 15) add("fail", "blurFail");
  else if (sharp < 40) add("warn", "blurWarn");
  else add("ok", "sharpOk");

  // glasses / headwear: "other/accessory" class around the eyes and above the forehead (heuristic)
  const frac = (x0, y0, x1, y1, cls) => {
    let hit = 0, tot = 0;
    for (let y = y0; y <= y1; y += (y1 - y0) / 20) for (let x = x0; x <= x1; x += (x1 - x0) / 30) {
      tot++; if (clsAt(x / W, y / H) === cls) hit++;
    }
    return tot ? hit / tot : 0;
  };
  const eyeBoxH = 0.08 * (chin.y - forehead.y);
  const gl = frac(Math.min(P(33).x, P(263).x) - 0.05 * faceW, E.y - eyeBoxH, Math.max(P(33).x, P(263).x) + 0.05 * faceW, E.y + eyeBoxH, CLS.OTHER);
  // A frame bridge leaves a sharp horizontal edge on the otherwise smooth nose bridge.
  // Strongest row of |vertical gradient| between the eyes, relative to cheek texture.
  const lum2 = (x, y) => { const i = (clamp(Math.round(y), 0, wh - 1) * ww + clamp(Math.round(x), 0, ww - 1)) * 4; return lum(data[i], data[i + 1], data[i + 2]); };
  const inL = P(133), inR = P(362), io = Math.hypot(inR.x - inL.x, inR.y - inL.y) * k, st = Math.max(1, io / 40);
  const bx = (inL.x + inR.x) / 2 * k, by = (inL.y + inR.y) / 2 * k, ck = { x: P(50).x * k, y: P(50).y * k };
  let cheekG = 0, cheekN = 0;
  for (let y = ck.y - io / 4; y <= ck.y + io / 4; y += st) for (let x = ck.x - io / 4; x <= ck.x + io / 4; x += st) {
    cheekG += Math.abs(lum2(x, y + st) - lum2(x, y - st)) + Math.abs(lum2(x + st, y) - lum2(x - st, y)); cheekN++;
  }
  const cheekRef = cheekG / cheekN / 2 + 1;
  let bridge = 0;
  for (let y = by - 0.45 * io; y <= by + 0.2 * io; y += st) {
    let s = 0, n = 0;
    for (let x = bx - 0.18 * io; x <= bx + 0.18 * io; x += st) { s += Math.abs(lum2(x, y + st) - lum2(x, y - st)); n++; }
    bridge = Math.max(bridge, s / n / cheekRef);
  }
  if (gl > 0.08 || bridge > 3.5) add("warn", "glasses");
  const hat = frac(fcX - 0.4 * faceW, top.y, fcX + 0.4 * faceW, forehead.y, CLS.OTHER);
  if (hat > 0.25) add("warn", "hat");

  return { checks, work, geo, k, lm };
}

// ---------------------------------------------------------------- rendering

let current = null;

function renderPhoto(img, geo, whiten) {
  const out = document.createElement("canvas");
  out.width = S; out.height = S;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, S, S);
  ctx.imageSmoothingQuality = "high";
  const draw = (src, x, y, w, h) => {
    ctx.save();
    ctx.translate(geo.T.x, geo.T.y); ctx.scale(geo.sc, geo.sc); ctx.rotate(-geo.roll); ctx.translate(-geo.E.x, -geo.E.y);
    ctx.drawImage(src, x, y, w, h);
    ctx.restore();
  };
  draw(img, 0, 0, geo.W, geo.H);
  if (whiten) {
    const mc = document.createElement("canvas"); mc.width = geo.mw; mc.height = geo.mh;
    const mctx = mc.getContext("2d"), id = mctx.createImageData(geo.mw, geo.mh);
    for (let i = 0; i < geo.bgConf.length; i++) {
      id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255;
      id.data[i * 4 + 3] = Math.round(clamp((geo.bgConf[i] - 0.2) / 0.6, 0, 1) * 255);
    }
    mctx.putImageData(id, 0, 0);
    // overhang the photo by a few pixels so its anti-aliased border does not show as a grey seam
    const pad = 4 / geo.sc;
    draw(mc, -pad, -pad, geo.W + 2 * pad, geo.H + 2 * pad);
  }
  return out;
}

function renderSheet(photo) {
  const sheet = document.createElement("canvas");
  sheet.width = 1800; sheet.height = 1200;                 // 6 x 4 in at 300 dpi
  const ctx = sheet.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 1800, 1200);
  const gap = 150, x0 = (1800 - 2 * S - gap) / 2, y0 = (1200 - S) / 2;
  ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1;
  for (const x of [x0, x0 + S + gap]) {
    ctx.drawImage(photo, x, y0);
    ctx.strokeRect(x - 0.5, y0 - 0.5, S + 1, S + 1);
  }
  return sheet;
}

const toBlob = (cv, q) => new Promise(res => cv.toBlob(res, "image/jpeg", q));

// Set the JFIF density to 300 dpi so print software reads 2 in / 6 in correctly.
async function with300dpi(blob) {
  const b = new Uint8Array(await blob.arrayBuffer());
  if (b[2] === 0xFF && b[3] === 0xE0 && String.fromCharCode(...b.slice(6, 10)) === "JFIF") {
    b[13] = 1; b[14] = 0x01; b[15] = 0x2C; b[16] = 0x01; b[17] = 0x2C;
  }
  return new Blob([b], { type: "image/jpeg" });
}

async function jpegUnder(cv, maxBytes) {
  for (let q = 0.95; q >= 0.5; q -= 0.05) {
    const b = await toBlob(cv, q);
    if (b.size <= maxBytes) return b;
  }
  return toBlob(cv, 0.5);
}

function showCanvas(id, src) {
  const cv = $(id); cv.width = src.width; cv.height = src.height;
  cv.getContext("2d").drawImage(src, 0, 0);
}

function setLink(id, blob) {
  const a = $(id);
  if (a.href) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(blob);
}

async function renderOutputs() {
  const { img, res } = current;
  const photo = renderPhoto(img, res.geo, $("whiten").checked);
  const sheet = renderSheet(photo);
  showCanvas("digital", photo);
  showCanvas("sheet", sheet);
  setLink("dlDigital", await with300dpi(await jpegUnder(photo, DIGITAL_MAX_BYTES)));
  setLink("dlSheet", await with300dpi(await toBlob(sheet, 0.95)));
  $("out").classList.remove("hidden");
}

function drawSourceView(res) {
  const cv = $("srcView"); cv.width = res.work.width; cv.height = res.work.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(res.work, 0, 0);
  if (!res.geo) return;
  const k = res.k, g = res.geo;
  ctx.lineWidth = Math.max(2, cv.width / 300);
  ctx.strokeStyle = "#2b6cb0"; ctx.beginPath();
  [[0, 0], [S, 0], [S, S], [0, S]].forEach(([u, v], i) => {
    const p = g.back(u, v); i ? ctx.lineTo(p.x * k, p.y * k) : ctx.moveTo(p.x * k, p.y * k);
  });
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = "#1f8a4c";
  for (const p of [g.top, g.chin]) {
    ctx.beginPath(); ctx.moveTo((p.x - 80 / k) * k, p.y * k); ctx.lineTo((p.x + 80 / k) * k, p.y * k); ctx.stroke();
  }
}

const ICON = { ok: "✓", warn: "!", fail: "✕", fix: "↻" };
const failed = res => !res.geo || res.checks.some(c => c.status === "fail");

function renderChecks(res) {
  const order = { fail: 0, warn: 1, fix: 2, ok: 3 };
  $("checks").innerHTML = res.checks.slice().sort((a, b) => order[a.status] - order[b.status]).map(c => {
    const [t, d] = checkText(c);
    return `<li class="${c.status}"><span class="ic">${ICON[c.status]}</span><div><div class="t">${t}</div>${d ? `<div class="d">${d}</div>` : ""}</div></li>`;
  }).join("");
  const warns = res.checks.filter(c => c.status === "warn").length;
  const v = $("verdict");
  if (failed(res)) { v.className = "verdict fail"; v.textContent = L().ui.verdictFail; }
  else { v.className = "verdict ok"; v.textContent = warns ? L().ui.verdictWarn(warns) : L().ui.verdictOk; }
}

async function processFile(file) {
  if (!file) return;
  status("processing");
  await ready;
  const img = await loadImage(file);
  const res = analyze(img);
  current = { img, res };
  window.__last = res;   // for automated testing

  $("result").classList.remove("hidden");
  $("out").classList.add("hidden");
  drawSourceView(res);
  renderChecks(res);
  if (failed(res)) {
    setStep(2);
  } else {
    // flag the whitening switch when the background check complained
    const rec = !!res.geo.bgFixable;
    $("bgRec").classList.toggle("hidden", !rec);
    $("bgOpt").classList.remove("rec");
    if (rec) requestAnimationFrame(() => $("bgOpt").classList.add("rec"));
    $("whiten").checked = false;
    await renderOutputs();
    setStep(3);
  }
  status("done");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

const onPick = e => processFile(e.target.files[0]).catch(err => status("error", err.message)).finally(() => { e.target.value = ""; });
$("file").addEventListener("change", onPick);
$("cam").addEventListener("change", onPick);
$("whiten").addEventListener("change", () => current && renderOutputs());
window.__processFile = processFile;   // for automated testing

applyLang();
setStep(1);
</script>
</body>
</html>
